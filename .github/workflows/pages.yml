name: Publish mobile dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Beijing weekdays 08:17–16:47. GitHub schedules can run later than planned.
    - cron: '17,47 0-8 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read public source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify business logic
        run: python -m unittest discover -s tests -v
      - name: Verify mobile data logic
        run: node --test tests/test_platform.cjs
      - name: Update public schedule
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_web_data.py --fallback-url "${PAGES_BASE_URL%/}/data/schedule.json"
      - name: Upload mobile dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
